[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speakeasy"
version = "0.1.0"
description = "本地语音栈（Silero-VAD + faster-whisper + CosyVoice2/F5-TTS）+ 云端 LLM 的实时英语口语对练"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "SpeakEasy" }]
keywords = ["english", "speaking", "asr", "tts", "vad", "llm", "fastapi"]

# 注意：torch / torchaudio 故意不在此处，见 docs/SETUP_GPU.md
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "numpy>=1.26,<3.0",
    "openai>=1.55,<2.0",
    "httpx>=0.27",
    "faster-whisper>=1.1.0",
    "ctranslate2>=4.5.0",
    "silero-vad>=5.1",
    "onnxruntime>=1.19",
    "soundfile>=0.12",
    "rich>=13.9",
    "tqdm>=4.66",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]
# 语音合成后端（二选一，都很重，见 backend/requirements-tts.txt）
tts-f5 = ["f5-tts", "vocos"]
docs = []

[project.scripts]
speakeasy = "app.__main__:main"

[project.urls]
Homepage = "https://github.com/yourname/speakeasy"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["personas/*.json", "static/**/*"]

# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "slow: 需要模型或 GPU 的慢测试（默认跳过）",
    "gpu: 需要 CUDA",
]
filterwarnings = ["ignore::DeprecationWarning"]

# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101", "B011"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true
