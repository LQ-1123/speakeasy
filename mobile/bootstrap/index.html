<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f7f7f5" />
<title>SpeakEasy</title>
<style>
  html,body{margin:0;height:100%;background:#f7f7f5;color:#1f2329;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;}
  .logo{font-size:26px;font-weight:700;letter-spacing:.5px;}
  .tip{font-size:14px;color:#7a828e;text-align:center;line-height:1.6;}
  .spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid #d9dde3;border-top-color:#3aae7d;animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  button{margin-top:8px;padding:10px 26px;border-radius:10px;border:0;background:#3aae7d;color:#fff;
    font-size:15px;font-weight:600;cursor:pointer;}
  button:active{opacity:.85}
  .hint{margin-top:6px;font-size:12px;color:#a0a7b3;max-width:320px;text-align:center;line-height:1.6}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">SpeakEasy</div>
    <div class="spinner" id="spin"></div>
    <div class="tip" id="tip">正在连接服务器…</div>
    <button id="retry" hidden>重试</button>
    <div class="hint" id="hint"></div>
  </div>
<script>
(function () {
  var API = "__API_BASE__";
  var KEY = "speakeasy.device_key.v1";
  var tip = document.getElementById("tip");
  var retry = document.getElementById("retry");
  var spin = document.getElementById("spin");
  var hint = document.getElementById("hint");

  function deviceKey() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return "";
      var value = JSON.parse(raw);
      return typeof value === "string" && value.length >= 8 ? value : "";
    } catch (e) {
      return "";
    }
  }

  function targetUrl() {
    var server = String(API || "").replace(/\/+$/, "");
    var key = deviceKey();
    var query = key ? "?se_device_key=" + encodeURIComponent(key) : "";
    return server + "/" + query + (location.hash || "");
  }

  function go() {
    location.replace(targetUrl());
  }

  function fail(message) {
    spin.hidden = true;
    tip.textContent = message || "连不上服务器";
    retry.hidden = false;
    hint.textContent = "请检查网络后重试；如果一直失败，可能是服务器正在升级。";
  }

  function ping() {
    retry.hidden = true;
    spin.hidden = false;
    tip.textContent = "正在连接服务器…";
    hint.textContent = "";
    var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = setTimeout(function () {
      if (controller) controller.abort();
    }, 7000);
    var server = String(API || "").replace(/\/+$/, "");
    fetch(server + "/api/v3/health", {
      signal: controller ? controller.signal : undefined,
      cache: "no-store",
    })
      .then(function (response) {
        clearTimeout(timer);
        if (response.ok) {
          go();
        } else {
          fail("服务器返回 " + response.status);
        }
      })
      .catch(function () {
        clearTimeout(timer);
        fail("网络不可用或服务器未启动");
      });
  }

  retry.onclick = ping;
  ping();
})();
</script>
</body>
</html>
