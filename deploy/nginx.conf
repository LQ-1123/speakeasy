# Include from nginx.conf's http block (for example sites-enabled/speakeasy).
# Update the hostname and deployment path before enabling; add TLS with certbot.
map $http_upgrade $speakeasy_connection {
    default upgrade;
    ''      '';
}
upstream speakeasy_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;
    client_max_body_size 30m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    # An empty Connection header preserves upstream HTTP keepalive for normal requests.
    proxy_set_header Connection $speakeasy_connection;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Only the public Next build tree is served directly. Audio and all other
    # paths still pass through application authentication and owner checks.
    location ^~ /_next/static/ {
        # Publish only this public build directory here; nginx workers normally
        # cannot traverse /root. See docs/PERFORMANCE_CAPACITY.md deployment steps.
        alias /var/www/speakeasy/_next/static/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Persistent sockets and NDJSON need immediate delivery; ordinary responses
    # retain nginx's default response buffering.
    location ~ ^/(?:api/v3/client/events|api/v3/calls/[^/]+/stream|api/v2/stt/stream|api/v2/chat/[^/]+/call/turn(?:-text)?|ws(?:/.*)?)$ {
        proxy_pass http://speakeasy_backend;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location / {
        proxy_pass http://speakeasy_backend;
    }
}
