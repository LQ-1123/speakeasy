# SpeakEasy Nginx 反代示例
# 放置：/etc/nginx/sites-available/speakeasy  然后 ln -s 到 sites-enabled
# 首次先用 80 端口跑通，再执行 certbot --nginx -d 你的域名 自动加 HTTPS

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.example.com;

    # 语音上传（webm/wav）比较大
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Persistent call and notification sockets require an HTTP upgrade.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 通话是 NDJSON 流式返回，必须关掉缓冲，否则会攒着一次性发
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }
}

