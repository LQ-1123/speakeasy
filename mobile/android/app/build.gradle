apply plugin: 'com.android.application'

// 正式签名：若存在 mobile/android/keystore.properties 则用它签 release，
// 否则 release 回退到 debug 签名（保证本地也能产出可安装 APK）。
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def localBuildProps = new Properties()
if (rootProject.file("local.properties").exists()) localBuildProps.load(new FileInputStream(rootProject.file("local.properties")))
def localValue = { key -> localBuildProps.getProperty(key) ?: System.getenv(key) ?: "" }
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace "com.speakeasy.app"
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        encoding "UTF-8"
    }
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.speakeasy.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 410
        versionName "4.1.0"
        def apiBase = (project.findProperty("apiBase") ?: System.getenv("SPEAKEASY_API_BASE") ?: "https://47-104-24-236.sslip.io").replaceAll('/+$', '')
        def apiUri = new URI(apiBase)
        if (apiUri.scheme != 'https' || !apiUri.host || apiUri.userInfo || apiUri.rawQuery || apiUri.fragment || apiUri.path) {
            throw new GradleException("Android API base must be an HTTPS origin without a path, query, or credentials")
        }
        buildConfigField "String", "API_BASE", "\"${apiBase.replace("\\", "\\\\").replace("\"", "\\\"")}\""
        buildConfigField "String", "JPUSH_APP_KEY", "\"${localValue('JPUSH_APPKEY')}\""
        manifestPlaceholders += [JPUSH_PKGNAME: applicationId, JPUSH_APPKEY: localValue('JPUSH_APPKEY'), JPUSH_CHANNEL: "official",
            XIAOMI_APPID: localValue('XIAOMI_APPID'), XIAOMI_APPKEY: localValue('XIAOMI_APPKEY'),
            OPPO_APPID: localValue('OPPO_APPID'), OPPO_APPKEY: localValue('OPPO_APPKEY'), OPPO_APPSECRET: localValue('OPPO_APPSECRET'),
            VIVO_APPID: localValue('VIVO_APPID'), VIVO_APPKEY: localValue('VIVO_APPKEY'),
            MEIZU_APPID: localValue('MEIZU_APPID'), MEIZU_APPKEY: localValue('MEIZU_APPKEY'),
            HUAWEI_APPID: localValue('HUAWEI_APPID'), HONOR_APPID: localValue('HONOR_APPID')]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.9.25")
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "cn.jiguang.sdk:jpush:6.3.0"
    implementation "cn.jiguang.sdk:jcore:5.6.0"
    implementation "cn.jiguang.sdk.plugin:xiaomi:6.3.0"
    implementation "cn.jiguang.sdk.plugin:huawei:6.3.0"
    implementation "cn.jiguang.sdk.plugin:honor:6.3.0"
    implementation "cn.jiguang.sdk.plugin:oppo:6.3.0"
    implementation "cn.jiguang.sdk.plugin:vivo:6.3.0"
    implementation "cn.jiguang.sdk.plugin:meizu:6.3.0"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}


tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}
